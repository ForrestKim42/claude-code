collection:
  interval_hours: 6
  # Primary scraper: apify (reliable), instaloader (free but fragile)
  primary: "apify"
  fallback: "instaloader"
  # Optional: Instagram login for more data (instaloader)
  # instagram_username: ""
  # instagram_session_file: "session"

apify:
  # Set token via APIFY_API_TOKEN environment variable (recommended)
  # or paste your token here for local use only (do NOT commit to git)
  api_token: ""
  actor_id: "apify/instagram-scraper"

storage:
  db_path: "data/reels.db"

report:
  output_dir: "reports"
  html_file: "dashboard.html"
