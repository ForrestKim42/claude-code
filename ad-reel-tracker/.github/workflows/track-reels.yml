name: Track Instagram Ad Reels

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_collect:
        description: 'Force collection even if recent data exists'
        required: false
        default: 'false'

permissions:
  contents: write  # needed to commit dashboard to repo

jobs:
  track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ad-reel-tracker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ad-reel-tracker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect reel metrics (Apify)
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python main.py --collect --apify

      - name: Generate HTML dashboard
        run: python main.py --report

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-dashboard-${{ github.run_number }}
          path: ad-reel-tracker/reports/dashboard.html
          retention-days: 90

      - name: Commit updated data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reels.db reports/dashboard.html || true
          git diff --staged --quiet || git commit -m "chore: update reel metrics $(date -u +%Y-%m-%dT%H:%M)Z"
          git push origin HEAD || echo "Push failed (possibly nothing to commit)"
